<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono personalizado de Lujo para App en Celular (iPhone y Android) -->
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <title>Whiskeria 2000 - Acceso</title>
    <style>
        .neon-pink { text-shadow: 0 0 15px #ec4899; color: #ec4899; }
        .border-glow {
            border: 2px solid #ec4899;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.2);
        }
        /* Estilo interactivo premium para inputs */
        .input-premium {
            background-color: #000000 !important;
            border: 1.5px solid #27272a !important;
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            border-color: #ec4899 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.15);
        }
    </style>
</head>
<body class="bg-[#020202] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-900/90 p-8 rounded-[40px] border border-glow shadow-2xl text-center animate-fade-in">
        <img src="/static/logo.png" class="w-28 h-28 mx-auto mb-6 rounded-full border-4 border-yellow-500 shadow-lg object-cover">
        <h1 class="text-2xl font-black text-white uppercase italic mb-8 tracking-tighter">Acceso al Sistema</h1>
        
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 p-3 rounded-2xl mb-6 text-red-500 text-xs font-bold uppercase tracking-wide">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-4">
            <input name="username" type="text" placeholder="USUARIO" class="input input-premium w-full text-center font-bold border-zinc-700 focus:border-pink-500 h-11 rounded-2xl text-sm" required>
            <input name="password" type="password" placeholder="CONTRASEÑA" class="input input-premium w-full text-center font-bold border-zinc-700 focus:border-pink-500 h-11 rounded-2xl text-sm" required>
            
            <button type="submit" class="btn btn-secondary w-full font-black text-lg shadow-xl uppercase h-11 rounded-2xl bg-pink-600 hover:bg-pink-700 border-none">Entrar</button>
        </form>
        
        <p class="text-zinc-600 text-[9px] mt-6 uppercase font-bold tracking-widest">Whiskeria 2000 Pro v2.0</p>
    </div>
</body>
</html>
