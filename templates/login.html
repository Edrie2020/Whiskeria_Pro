<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono personalizado de Lujo para App en Celular (iPhone y Android) -->
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <title>Whiskeria 2000 - Acceso</title>
    <style>
        .neon-pink { text-shadow: 0 0 15px #ec4899; color: #ec4899; }
        .border-glow {
            border: 2px solid #ec4899;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.25);
        }
        /* Estilo interactivo premium para inputs */
        .input-premium {
            background-color: #000000 !important;
            border: 1.5px solid #27272a !important;
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            border-color: #ec4899 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.2);
        }
    </style>
</head>
<body class="bg-[#020202] min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-zinc-950 p-8 rounded-[40px] border-glow text-center">
        <!-- Logotipo Redondo con Borde Dorado -->
        <img src="/static/logo.png" class="w-28 h-28 mx-auto mb-6 rounded-full border-4 border-yellow-500 shadow-2xl object-cover">
        
        <h1 class="text-2xl sm:text-3xl font-black text-white uppercase italic mb-8 tracking-tighter">Acceso al Sistema</h1>
        
        <!-- Formulario Seguro hacia /login -->
        <form action="/login" method="post" class="space-y-4">
            
            <div class="form-control">
                <input name="username" type="text" placeholder="USUARIO" class="input input-premium w-full uppercase font-bold text-xs h-11 text-center rounded-2xl" required>
            </div>
            
            <div class="form-control">
                <input name="password" type="password" placeholder="CONTRASEÑA" class="input input-premium w-full font-bold text-xs h-11 text-center rounded-2xl" required>
            </div>
            
            <button type="submit" class="btn btn-secondary w-full font-black text-sm h-11 min-h-0 rounded-2xl text-white uppercase tracking-wider shadow-lg shadow-pink-500/10 mt-2">
                ENTRAR
            </button>
        </form>
        
        <p class="text-zinc-600 text-[9px] mt-8 uppercase font-bold tracking-[2px]">Whiskeria 2000 Pro v2.0</p>
    </div>

</body>
</html>
