<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <title>Asistencia - Whiskeria 2000</title>
    <style>
        .neon-green { text-shadow: 0 0 10px #22c55e; color: #22c55e; }
        .card-pro { 
            background: rgba(24, 24, 27, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.3s;
        }
        .nombre-artista {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-[#020202] text-white min-h-screen p-4 sm:p-6">

    <!-- HEADER UNIFICADO (Alineación y proporciones idénticas a Damas) -->
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4 mb-6 border-b border-green-500/20 pb-4 px-3">
        <div class="flex items-center gap-4">
            <a href="/" class="btn btn-xs sm:btn-sm btn-outline btn-warning rounded-full font-black px-4 h-8 shrink-0 text-[10px] sm:text-xs uppercase tracking-wider">
                ← SALÓN
            </a>
            <h1 class="text-xl sm:text-3xl font-black text-green-400 uppercase italic tracking-tighter neon-green truncate leading-none">
                Asistencia Diaria
            </h1>
        </div>
        <div class="text-right shrink-0">
            <span class="text-[10px] font-black text-zinc-400 uppercase block tracking-widest">{{ turno }}</span>
        </div>
    </div>

    <div class="max-w-7xl mx-auto {% if role not in ['admin1', 'administrador', 'cajera'] %} pointer-events-none opacity-85 {% endif %}">
        
        <!-- SECCIÓN AUSENTES -->
        <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-[4px] mb-6 text-center md:text-left italic">● Damas por Ingresar (Ausentes)</h2>
        
        <!-- BUSCADOR EN TIEMPO REAL -->
        <div class="mb-6 max-w-md mx-auto md:mx-0">
            <input type="text" id="buscadorAsistencia" onkeyup="filtrarAsistencia()" 
                   placeholder="🔍 BUSCAR DAMA POR NOMBRE..." 
                   class="input input-bordered w-full bg-black border-zinc-700 font-bold uppercase text-center focus:border-green-400 text-xs h-10 rounded-xl text-white">
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-16">
            {% for dama in ausentes %}
            <div class="card-pro p-4 rounded-[30px] flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                
                <!-- IZQUIERDA: FOTO Y NOMBRE -->
                <div class="flex items-center gap-4 w-full sm:w-1/3">
                    <img src="{{ dama.foto_url }}" 
                         class="w-14 h-14 rounded-full object-cover border-2 border-zinc-700 flex-none shadow-lg">
                    <h3 class="font-black text-lg uppercase italic tracking-tighter nombre-artista" title="{{ dama.nombre_artistico }}">
                        {{ dama.nombre_artistico }}
                    </h3>
                </div>
                
                <!-- DERECHA: FORMULARIO SIMPLIFICADO -->
                <form action="/marcar_asistencia" method="post" class="flex flex-wrap sm:flex-nowrap gap-3 items-center justify-center sm:justify-end w-full sm:w-2/3">
                    <input type="hidden" name="dama_id" value="{{ dama.id }}">
                    
                    <select name="tipo_llegada" class="select select-bordered select-sm bg-black text-pink-400 font-black border-zinc-700 text-xs rounded-xl">
                        <option value="Externa">Externa</option>
                        <option value="Residente">Residente</option>
                    </select>
                    
                    {% if turno == 'Turno 1' %}
                    <!-- Checkbox interactivo rápido para asignar bono de asistencia -->
                    <label class="label cursor-pointer flex items-center gap-2 bg-black/40 px-4 py-1.5 rounded-xl border border-zinc-800">
                        <span class="label-text text-[10px] font-black uppercase text-zinc-400">¿Recibe Pago?</span>
                        <input type="checkbox" name="bono_asistencia" class="checkbox checkbox-xs checkbox-success" value="on">
                    </label>
                    {% endif %}
                    
                    <button type="submit" class="btn btn-success btn-sm font-black px-6 shadow-lg shadow-green-500/20 rounded-xl">ASISTENTE</button>
                </form>
            </div>
            {% endfor %}
        </div>

        <!-- SECCIÓN PRESENTES -->
        <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-[4px] mb-6 text-center md:text-left italic">● Ya en Salón (Presentes)</h2>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
            {% for dama in presentes %}
            <div class="bg-green-500/5 p-4 rounded-[35px] border border-green-500/20 flex flex-col items-center relative group hover:bg-green-500/10 transition-all">
                
                <!-- Botón Salida -->
                <form action="/dar_salida/{{ dama.id }}" method="post" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                    <button type="submit" class="btn btn-circle btn-xs btn-error btn-outline" onclick="return confirm('¿Dar salida a {{ dama.nombre_artistico }}?')">✕</button>
                </form>

                <!-- Foto con círculo de estado -->
                <div class="relative mb-3">
                    <img src="{{ dama.foto_url }}" 
                         class="w-20 h-20 rounded-full object-cover border-4 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.4)] flex-none">
                    <div class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-black rounded-full animate-pulse"></div>
                </div>

                <span class="text-xs font-black uppercase text-white tracking-widest text-center">{{ dama.nombre_artistico }}</span>
                <span class="text-[8px] font-bold text-green-400 mt-1 uppercase tracking-widest">● EN SALÓN</span>
            </div>
            {% endfor %}
        </div>
    </div>
    <script>
        function filtrarAsistencia() {
            const input = document.getElementById("buscadorAsistencia").value.toUpperCase();
            const cards = document.querySelectorAll(".card-pro");
            cards.forEach(card => {
                const nombreElement = card.querySelector(".nombre-artista");
                if (nombreElement) {
                    const nombre = nombreElement.textContent || nombreElement.innerText;
                    if (nombre.toUpperCase().includes(input)) {
                        card.style.display = "";
                    } else {
                        card.style.display = "none";
                    }
                }
            });
        }
    </script>
</body>
</html>
