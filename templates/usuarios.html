<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Accesos - Whiskeria 2000</title>
    <style>
        .neon-yellow { text-shadow: 0 0 15px #facc15; color: #facc15; }
        .card-user { 
            background: linear-gradient(135deg, #121214 0%, #0a0a0b 100%); 
            border: 1px solid rgba(250, 204, 21, 0.15); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .card-user:hover {
            transform: translateY(-2px);
            border-color: rgba(250, 204, 21, 0.4);
            box-shadow: 0 15px 35px rgba(250, 204, 21, 0.05);
        }
        /* Estilo interactivo premium para inputs */
        .input-premium {
            background-color: #000000 !important;
            border: 1.5px solid #27272a !important;
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            border-color: #facc15 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.15);
        }
    </style>
</head>
<body class="bg-[#020202] text-white p-3 md:p-8 font-sans">

        <div class="max-w-4xl mx-auto">
            <!-- HEADER RESPONSIVE -->
            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b border-zinc-800 pb-4">
                <h1 class="text-2xl sm:text-3xl font-black text-yellow-500 uppercase italic tracking-tighter neon-yellow text-center sm:text-left">Control de Accesos</h1>
                <a href="/" class="btn btn-xs sm:btn-sm btn-outline btn-warning rounded-full font-black px-4 sm:px-6 h-8 min-h-0 text-[10px] sm:text-xs uppercase tracking-wider">
    ← SALÓN
</a>
            </div>

            <!-- FORMULARIO PREMIUM: CREAR NUEVO USUARIO -->
            <div class="bg-gradient-to-br from-zinc-950 to-black p-6 rounded-[35px] border border-yellow-500/20 mb-8 shadow-2xl">
                <h2 class="text-[10px] font-black text-zinc-500 uppercase mb-4 tracking-[3px] text-center sm:text-left">➕ Registrar Nuevo Usuario</h2>
                
                <form action="/usuarios/crear" method="post" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3.5">
                    <div class="form-control">
                        <input name="username" placeholder="USUARIO" class="input input-premium w-full uppercase font-bold text-xs h-11 text-center rounded-2xl" required>
                    </div>
                    <div class="form-control">
                        <input name="password" type="password" placeholder="CONTRASEÑA" class="input input-premium w-full font-bold text-xs h-11 text-center rounded-2xl" required>
                    </div>
                    <div class="form-control">
                        <select name="rol" class="select select-bordered w-full bg-black border-zinc-800 font-black uppercase text-[10px] h-11 min-h-0 text-center rounded-2xl focus:border-yellow-500 focus:outline-none">
                            <option value="garzon">Garzón (Vendedor)</option>
                            <option value="cajera">Cajera (Poder Total)</option>
                            <option value="admin">Administrador (Poder Total)</option>
                            <option value="jefe">Dueño / Jefe (Poder Total)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-sm btn-warning w-full font-black shadow-lg shadow-yellow-500/20 h-11 min-h-0 text-xs rounded-2xl text-black uppercase">
                        CREAR ACCESO
                    </button>
                </form>
            </div>

            <!-- LISTA DE USUARIOS -->
            <h2 class="text-[10px] font-black text-zinc-500 uppercase mb-4 tracking-[2px] text-center sm:text-left">👥 Usuarios en el Sistema</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {% for u in usuarios %}
                <div class="card-user p-5 rounded-[28px] flex justify-between items-center">
                    <div>
                        <h3 class="font-black text-xl uppercase text-white tracking-tight">{{ u.username }}</h3>
                        <div class="badge badge-warning badge-outline font-black text-[8px] uppercase mt-1.5 px-2 py-1">{{ u.rol }}</div>
                    </div>
                    <div class="flex gap-2">
                        <!-- BOTÓN CAMBIAR CLAVE -->
                        <button onclick="pedirNuevaClave('{{ u.id }}', '{{ u.username }}')" class="btn btn-circle btn-sm btn-ghost border border-zinc-800 hover:bg-yellow-500 hover:text-black shadow-lg transition-all" title="Cambiar Contraseña">🔑</button>
                        
                        <!-- BOTÓN ELIMINAR (Protegemos al admin maestro) -->
                        {% if u.username != 'admin' %}
                        <form action="/usuarios/eliminar/{{ u.id }}" method="post" onsubmit="return confirm('¿ESTÁ SEGURO DE ELIMINAR EL ACCESO A ESTE USUARIO?')">
                            <button class="btn btn-circle btn-sm btn-error btn-outline shadow-lg transition-all">✕</button>
                        </form>
                        {% endif %}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- LÓGICA PARA CAMBIAR CLAVE SIN SALIR DE LA PÁGINA (CONSERVA TU JAVASCRIPT ORIGINAL) -->
        <script>
            function pedirNuevaClave(id, nombre) {
                let nueva = prompt("Ingrese la nueva contraseña para " + nombre.toUpperCase() + ":");
                if (nueva && nueva.length >= 4) {
                    let f = document.createElement('form');
                    f.method = 'POST'; f.action = '/usuarios/cambiar_password/' + id;
                    let i = document.createElement('input');
                    i.type = 'hidden'; i.name = 'nueva_clave'; i.value = nueva;
                    f.appendChild(i); document.body.appendChild(f);
                    f.submit();
                } else if (nueva) {
                    alert("La clave debe tener al menos 4 caracteres.");
                }
            }
        </script>
    </body>
    </html>
